# Workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Upload static files in a dedicated job so the artifact is fully indexed before deploy starts
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Auto-stamp SW cache & build number
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i -E "s|^const CACHE_NAME = [\"'][^\"']+[\"'];|const CACHE_NAME = \"po-directory-b${BUILD_NUM}-${SHORT_SHA}\";|" sw.js
          sed -i -E "s|^const APP_BUILD_CODE = [\"'][^\"']+[\"'];|const APP_BUILD_CODE = \"${BUILD_NUM}\";|" js/01-config.js
          echo "Stamped CACHE_NAME=po-directory-b${BUILD_NUM}-${SHORT_SHA}, APP_BUILD_CODE=${BUILD_NUM}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  # Deploy job runs after build completes
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
