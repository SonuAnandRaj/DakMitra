name: Fix Missing Public Functions on Mumbai

on:
  workflow_dispatch:
    inputs:
      confirm_fix:
        description: "Type FIX_FUNCS to inspect and apply missing public functions to Mumbai"
        required: true
        type: string

jobs:
  fix_funcs:
    runs-on: ubuntu-latest
    steps:
      - name: Guard accidental run
        if: ${{ inputs.confirm_fix != 'FIX_FUNCS' }}
        run: |
          echo "Set confirm_fix to FIX_FUNCS to execute."
          exit 1

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: List public functions in France vs Mumbai
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          psql "$OLD_DB_URL" -Atc "
            SELECT p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')'
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
            ORDER BY 1;
          " > /tmp/fr_funcs.txt

          psql "$NEW_DB_URL" -Atc "
            SELECT p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')'
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
            ORDER BY 1;
          " > /tmp/mu_funcs.txt

          echo "=== FRANCE PUBLIC FUNCTIONS COUNT ==="
          wc -l < /tmp/fr_funcs.txt
          echo "=== MUMBAI PUBLIC FUNCTIONS COUNT ==="
          wc -l < /tmp/mu_funcs.txt
          echo "=== FUNCTIONS IN FRANCE BUT MISSING IN MUMBAI ==="
          comm -23 /tmp/fr_funcs.txt /tmp/mu_funcs.txt || true

      - name: Dump & apply all CREATE FUNCTION statements cleanly
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          pg_dump "$OLD_DB_URL" \
            --schema=public \
            --schema-only \
            --no-owner \
            --no-privileges \
            -f /tmp/full_public_schema.sql

          python3 - <<'PY'
          import re

          with open("/tmp/full_public_schema.sql", "r", encoding="utf-8") as f:
              sql = f.read()

          # Split SQL into top-level statements respecting $$...$$ / $tag$...$tag$ and '...'
          stmts = []
          buf = []
          i = 0
          n = len(sql)
          dollar_tag = None
          in_sq = False

          while i < n:
              ch = sql[i]
              if dollar_tag is not None:
                  if sql.startswith(dollar_tag, i):
                      buf.append(dollar_tag)
                      i += len(dollar_tag)
                      dollar_tag = None
                      continue
                  buf.append(ch)
                  i += 1
                  continue

              if in_sq:
                  if ch == "'" and i + 1 < n and sql[i + 1] == "'":
                      buf.append("''")
                      i += 2
                      continue
                  if ch == "'":
                      in_sq = False
                  buf.append(ch)
                  i += 1
                  continue

              # Check start of dollar quote ($ or $tag$)
              if ch == "$":
                  m = re.match(r"\$[A-Za-z0-9_]*\$", sql[i:])
                  if m:
                      tag = m.group(0)
                      dollar_tag = tag
                      buf.append(tag)
                      i += len(tag)
                      continue

              if ch == "'":
                  in_sq = True
                  buf.append(ch)
                  i += 1
                  continue

              if ch == ";":
                  stmt = "".join(buf).strip()
                  if stmt:
                      stmts.append(stmt + ";")
                  buf = []
                  i += 1
                  continue

              buf.append(ch)
              i += 1

          func_stmts = []
          for s in stmts:
              # Strip leading comment lines to inspect statement keyword
              lines = [ln for ln in s.splitlines() if not ln.lstrip().startswith("--")]
              clean = "\n".join(lines).lstrip()
              if re.match(r"^CREATE\s+(OR\s+REPLACE\s+)?FUNCTION\b", clean, flags=re.IGNORECASE):
                  fixed = re.sub(
                      r"^CREATE\s+FUNCTION\b",
                      "CREATE OR REPLACE FUNCTION",
                      clean,
                      count=1,
                      flags=re.IGNORECASE,
                  )
                  func_stmts.append(fixed)

          print(f"Extracted {len(func_stmts)} function statements.")
          with open("/tmp/clean_funcs.sql", "w", encoding="utf-8") as f:
              f.write("\n\n".join(func_stmts) + "\n")
          PY

          psql "$NEW_DB_URL" -v ON_ERROR_STOP=0 -f /tmp/clean_funcs.sql > /tmp/apply_out.txt 2>&1 || true
          echo "=== ERRORS DURING FUNCTION APPLY ==="
          grep -E "^(ERROR|psql:)" /tmp/apply_out.txt || echo "None"

      - name: Re-verify counts & remaining missing functions
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          psql "$OLD_DB_URL" -Atc "
            SELECT p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')'
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' ORDER BY 1;
          " > /tmp/fr_funcs_after.txt

          psql "$NEW_DB_URL" -Atc "
            SELECT p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')'
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' ORDER BY 1;
          " > /tmp/mu_funcs_after.txt

          echo "=== AFTER SYNC COUNTS ==="
          psql "$NEW_DB_URL" -c "
            SELECT
              (SELECT count(*) FROM public.post_offices) AS post_offices_rows,
              (SELECT count(*) FROM public.post_offices_history) AS post_offices_history_rows,
              (SELECT count(*) FROM public.superadmin_audit_logs) AS audit_logs_preserved,
              (SELECT count(*) FROM auth.users) AS auth_users_preserved,
              (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public') AS public_funcs;
          "

          echo "=== STILL MISSING IN MUMBAI (IF ANY) ==="
          comm -23 /tmp/fr_funcs_after.txt /tmp/mu_funcs_after.txt || echo "All functions matched!"