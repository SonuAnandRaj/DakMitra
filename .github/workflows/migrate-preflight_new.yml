name: Supabase Migration Pre-Flight (Read-Only)

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Install latest PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version

      - name: Verify France & Mumbai connections (Read-Only)
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
          run: |
          echo "=== 1. POSTGRES VERSIONS ==="
          psql "$OLD_DB_URL" -Atc "SELECT 'FRANCE: ' || version();"
          psql "$NEW_DB_URL" -Atc "SELECT 'MUMBAI: ' || version();"

          echo "=== 2. PUBLIC TABLES & EXACT ROW COUNTS (FRANCE) ==="
          psql "$OLD_DB_URL" -c "
            SELECT table_name,
              (xpath('/row/cnt/text()', query_to_xml(format('SELECT count(*) AS cnt FROM public.%I', table_name), false, true, '')))[1]::text::int AS rows
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
            ORDER BY table_name;
          "

          echo "=== 3. AUTH COUNTS (FRANCE, NO PII) ==="
          psql "$OLD_DB_URL" -c "
            SELECT 'auth.users' AS table_name, count(*) AS rows FROM auth.users
            UNION ALL
            SELECT 'auth.identities', count(*) FROM auth.identities;
          "

          echo "=== 4. CUSTOM TRIGGERS ON auth.users (FRANCE) ==="
          psql "$OLD_DB_URL" -c "
            SELECT t.tgname, n.nspname || '.' || p.proname AS func_name
            FROM pg_trigger t
            JOIN pg_proc p ON p.oid = t.tgfoid
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE t.tgrelid = 'auth.users'::regclass AND NOT t.tgisinternal
            ORDER BY t.tgname;
          "

          echo "=== 5. STORAGE BUCKETS & POLICIES (FRANCE) ==="
          psql "$OLD_DB_URL" -c "SELECT id, name, public, file_size_limit, allowed_mime_types FROM storage.buckets ORDER BY name;"
          psql "$OLD_DB_URL" -c "SELECT policyname, cmd, roles FROM pg_policies WHERE schemaname = 'storage' AND tablename = 'objects' ORDER BY policyname;"

          echo "=== 6. REALTIME PUBLICATION TABLES (FRANCE) ==="
          psql "$OLD_DB_URL" -c "SELECT schemaname, tablename FROM pg_publication_tables WHERE pubname = 'supabase_realtime' ORDER BY schemaname, tablename;"

          echo "=== 7. SAFETY CHECK: PUBLIC TABLES ALREADY ON MUMBAI ==="
          psql "$NEW_DB_URL" -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' ORDER BY table_name;"
