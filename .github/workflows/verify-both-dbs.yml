name: Verify Both Databases (France vs Mumbai)

on:
  workflow_dispatch:

jobs:
  compare_dbs:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Compare public tables, auth, storage, realtime & triggers
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e

          psql "$OLD_DB_URL" -Atc "
            SELECT table_name,
              (xpath('/row/cnt/text()', query_to_xml(format('SELECT count(*) AS cnt FROM public.%I', table_name), false, true, '')))[1]::text::int AS rows
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
            ORDER BY table_name;
          " > /tmp/france_public.txt

          psql "$NEW_DB_URL" -Atc "
            SELECT table_name,
              (xpath('/row/cnt/text()', query_to_xml(format('SELECT count(*) AS cnt FROM public.%I', table_name), false, true, '')))[1]::text::int AS rows
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
            ORDER BY table_name;
          " > /tmp/mumbai_public.txt

          echo "=== 1. PUBLIC TABLE ROW COUNTS (FRANCE vs MUMBAI) ==="
          python3 - <<'PY'
          def load_counts(path):
              d = {}
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if "|" in line:
                          k, v = line.split("|", 1)
                          d[k.strip()] = int(v.strip())
              return d

          fr = load_counts("/tmp/france_public.txt")
          mu = load_counts("/tmp/mumbai_public.txt")
          all_tables = sorted(set(fr) | set(mu))

          print(f"{'table_name':<25} | {'france':>7} | {'mumbai':>7} | {'status'}")
          print("-" * 62)
          mismatches = 0
          for t in all_tables:
              f_cnt = fr.get(t)
              m_cnt = mu.get(t)
              ok = (f_cnt == m_cnt) and (f_cnt is not None)
              if not ok:
                  mismatches += 1
              status = "MATCH" if ok else "DIFF"
              print(f"{t:<25} | {str(f_cnt):>7} | {str(m_cnt):>7} | {status}")
          print(f"\nTotal tables: {len(all_tables)} | Mismatches: {mismatches}")
          PY

          echo "=== 2. AUTH USERS & IDENTITIES (FRANCE vs MUMBAI) ==="
          echo "-- FRANCE --"
          psql "$OLD_DB_URL" -c "
            SELECT
              (SELECT count(*) FROM auth.users) AS users,
              (SELECT count(*) FROM auth.users WHERE email_confirmed_at IS NOT NULL) AS confirmed_users,
              (SELECT count(*) FROM auth.identities) AS identities;
          "
          echo "-- MUMBAI --"
          psql "$NEW_DB_URL" -c "
            SELECT
              (SELECT count(*) FROM auth.users) AS users,
              (SELECT count(*) FROM auth.users WHERE email_confirmed_at IS NOT NULL) AS confirmed_users,
              (SELECT count(*) FROM auth.identities) AS identities;
          "

          echo "=== 3. FUNCTIONS, TRIGGERS, RLS, GRANTS, STORAGE & REALTIME ==="
          echo "-- FRANCE --"
          psql "$OLD_DB_URL" -c "
            SELECT
              (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public') AS public_funcs,
              (SELECT count(*) FROM pg_policies WHERE schemaname = 'public') AS public_rls_policies,
              (SELECT count(*) FROM storage.buckets) AS buckets,
              (SELECT count(*) FROM pg_policies WHERE schemaname = 'storage' AND tablename = 'objects') AS storage_policies,
              (SELECT count(*) FROM pg_publication_tables WHERE pubname = 'supabase_realtime' AND schemaname = 'public') AS realtime_tables,
              (SELECT tgenabled::text FROM pg_trigger WHERE tgrelid = 'auth.users'::regclass AND tgname = 'on_auth_user_created') AS auth_trigger;
          "
          echo "-- MUMBAI --"
          psql "$NEW_DB_URL" -c "
            SELECT
              (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public') AS public_funcs,
              (SELECT count(*) FROM pg_policies WHERE schemaname = 'public') AS public_rls_policies,
              (SELECT count(*) FROM storage.buckets) AS buckets,
              (SELECT count(*) FROM pg_policies WHERE schemaname = 'storage' AND tablename = 'objects') AS storage_policies,
              (SELECT count(*) FROM pg_publication_tables WHERE pubname = 'supabase_realtime' AND schemaname = 'public') AS realtime_tables,
              (SELECT tgenabled::text FROM pg_trigger WHERE tgrelid = 'auth.users'::regclass AND tgname = 'on_auth_user_created') AS auth_trigger;
          "

          echo "=== 4. MUMBAI ANON & AUTHENTICATED TABLE GRANTS CHECK ==="
          psql "$NEW_DB_URL" -c "
            SELECT table_name,
              has_table_privilege('anon', format('public.%I', table_name), 'SELECT') AS anon_select,
              has_table_privilege('authenticated', format('public.%I', table_name), 'SELECT') AS auth_select
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
            ORDER BY table_name;
          "