name: Supabase Migration Step 3 - Schema & Data Clone

on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: 'Type MIGRATE to clone schema, auth, and public data into NEW_DB_URL'
        required: true
        type: string

jobs:
  clone_db:
    runs-on: ubuntu-latest
    steps:
      - name: Guard accidental run
        if: ${{ inputs.confirm_restore != 'MIGRATE' }}
        run: |
          echo "Set confirm_restore to MIGRATE to execute."
          exit 1

      - name: Install latest PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version

      - name: Dump & restore public schema to Mumbai
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          pg_dump "$OLD_DB_URL" \
            --schema=public \
            --schema-only \
            --no-owner \
            --no-privileges \
            -f /tmp/public_schema.sql

            sed -i '/^CREATE SCHEMA public;/d' /tmp/public_schema.sql
            psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/public_schema.sql

            - name: Clone auth.users & auth.identities safely
            env:
              OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
              NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
            run: |
              set -e
              pg_dump "$OLD_DB_URL" \
                --table=auth.users \
                --table=auth.identities \
                --data-only \
                --inserts \
                --rows-per-insert=100 \
                --no-owner \
                --no-privileges \
                -f /tmp/auth_data.sql
    
              sed -i '/^SET /d' /tmp/auth_data.sql
              {
                echo "SET session_replication_role = 'replica';"
                cat /tmp/auth_data.sql
                echo "SET session_replication_role = 'origin';"
              } | psql "$NEW_DB_URL" -v ON_ERROR_STOP=1

      - name: Clone public table data & sequences
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          pg_dump "$OLD_DB_URL" \
            --schema=public \
            --data-only \
            --inserts \
            --rows-per-insert=200 \
            --no-owner \
            --no-privileges \
            -f /tmp/public_data.sql

          sed -i '/^SET /d' /tmp/public_data.sql
          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/public_data.sql

          # Sync all serial/identity sequences in public to max(id)
          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              r RECORD;
              seq_name text;
              max_id bigint;
            BEGIN
              FOR r IN
                SELECT table_name
                FROM information_schema.columns
                WHERE table_schema = 'public' AND column_name = 'id' AND data_type IN ('smallint','integer','bigint')
              LOOP
                seq_name := pg_get_serial_sequence(format('public.%I', r.table_name), 'id');
                IF seq_name IS NOT NULL THEN
                  EXECUTE format('SELECT COALESCE(MAX(id), 0) FROM public.%I', r.table_name) INTO max_id;
                  PERFORM setval(seq_name, GREATEST(max_id, 1), max_id > 0);
                END IF;
              END LOOP;
            END
            \$\$;
          "

      - name: Verify row counts & triggers on Mumbai
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          echo "=== MUMBAI PUBLIC ROW COUNTS ==="
          psql "$NEW_DB_URL" -c "
            SELECT table_name,
              (xpath('/row/cnt/text()', query_to_xml(format('SELECT count(*) AS cnt FROM public.%I', table_name), false, true, '')))[1]::text::int AS rows
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
            ORDER BY table_name;
          "

          echo "=== MUMBAI AUTH ROW COUNTS ==="
          psql "$NEW_DB_URL" -c "
            SELECT 'auth.users' AS table_name, count(*) AS rows FROM auth.users
            UNION ALL
            SELECT 'auth.identities', count(*) FROM auth.identities;
          "

          echo "=== MUMBAI auth.users TRIGGER STATUS ==="
          psql "$NEW_DB_URL" -c "
            SELECT t.tgname, CASE t.tgenabled WHEN 'O' THEN 'ENABLED' ELSE t.tgenabled::text END AS status
            FROM pg_trigger t
            WHERE t.tgrelid = 'auth.users'::regclass AND t.tgname = 'on_auth_user_created';
          "