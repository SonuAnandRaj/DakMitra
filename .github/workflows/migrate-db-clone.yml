- name: Clone public table data & sequences
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          pg_dump "$OLD_DB_URL" \
            --schema=public \
            --data-only \
            --inserts \
            --rows-per-insert=200 \
            --no-owner \
            --no-privileges \
            -f /tmp/public_data.sql

          sed -i '/^SET /d' /tmp/public_data.sql

          # Clear any partial rows from the interrupted run before re-applying cleanly
          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "
            SET session_replication_role = 'replica';
            TRUNCATE TABLE
              public.admins,
              public.app_settings,
              public.auth_alerts,
              public.edit_requests,
              public.feedback_items,
              public.feedback_votes,
              public.office_staff,
              public.post_offices,
              public.post_offices_history,
              public.profiles,
              public.request_approvals,
              public.superadmin_audit_logs,
              public.superadmins,
              public.sync_meta,
              public.upload_batches,
              public.user_learning_progress
            RESTART IDENTITY CASCADE;
          "

          {
            echo "SET session_replication_role = 'replica';"
            cat /tmp/public_data.sql
            echo "SET session_replication_role = 'origin';"
          } | psql "$NEW_DB_URL" -v ON_ERROR_STOP=1

          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              r RECORD;
              seq_name text;
              max_id bigint;
            BEGIN
              FOR r IN
                SELECT table_name
                FROM information_schema.columns
                WHERE table_schema = 'public' AND column_name = 'id' AND data_type IN ('smallint','integer','bigint')
              LOOP
                seq_name := pg_get_serial_sequence(format('public.%I', r.table_name), 'id');
                IF seq_name IS NOT NULL THEN
                  EXECUTE format('SELECT COALESCE(MAX(id), 0) FROM public.%I', r.table_name) INTO max_id;
                  PERFORM setval(seq_name, GREATEST(max_id, 1), max_id > 0);
                END IF;
              END LOOP;
            END
            \$\$;
          "