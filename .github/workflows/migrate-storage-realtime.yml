name: Supabase Migration Step 4 - Storage, Realtime & Auth Trigger

on:
  workflow_dispatch:
    inputs:
      confirm_step4:
        description: "Type APPLY to configure storage, realtime, and auth trigger on NEW_DB_URL"
        required: true
        type: string

jobs:
  configure_mumbai:
    runs-on: ubuntu-latest
    steps:
      - name: Guard accidental run
        if: ${{ inputs.confirm_step4 != 'APPLY' }}
        run: |
          echo "Set confirm_step4 to APPLY to execute."
          exit 1

      - name: Install latest PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Clone storage buckets & policies to Mumbai
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          psql "$OLD_DB_URL" -Atc "
            SELECT format(
              'INSERT INTO storage.buckets (id, name, public, file_size_limit, allowed_mime_types) VALUES (%L, %L, %L, %s, %L::text[]) ON CONFLICT (id) DO UPDATE SET public = EXCLUDED.public, file_size_limit = EXCLUDED.file_size_limit, allowed_mime_types = EXCLUDED.allowed_mime_types;',
              id,
              name,
              public,
              COALESCE(file_size_limit::text, 'NULL'),
              COALESCE(allowed_mime_types::text, '{}')
            )
            FROM storage.buckets
            ORDER BY name;
          " > /tmp/buckets.sql

          psql "$OLD_DB_URL" -Atc "
            SELECT format(
              'DROP POLICY IF EXISTS %I ON storage.objects; CREATE POLICY %I ON storage.objects AS %s FOR %s TO %s%s%s;',
              policyname,
              policyname,
              permissive,
              cmd,
              array_to_string(roles, ', '),
              CASE WHEN qual IS NOT NULL AND qual <> '' THEN ' USING (' || qual || ')' ELSE '' END,
              CASE WHEN with_check IS NOT NULL AND with_check <> '' THEN ' WITH CHECK (' || with_check || ')' ELSE '' END
            )
            FROM pg_policies
            WHERE schemaname = 'storage' AND tablename = 'objects'
            ORDER BY policyname;
          " > /tmp/storage_policies.sql

          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/buckets.sql
          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/storage_policies.sql

      - name: Enable Realtime publication & auth.users trigger on Mumbai
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          psql "$OLD_DB_URL" -Atc "
            SELECT format(
              'DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_publication_tables WHERE pubname = ''supabase_realtime'' AND schemaname = %L AND tablename = %L) THEN ALTER PUBLICATION supabase_realtime ADD TABLE %I.%I; END IF; END \$\$;',
              schemaname, tablename, schemaname, tablename
            )
            FROM pg_publication_tables
            WHERE pubname = 'supabase_realtime'
            ORDER BY schemaname, tablename;
          " > /tmp/realtime.sql

          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/realtime.sql

          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "
            DROP TRIGGER IF EXISTS on_auth_user_created ON auth.users;
            CREATE TRIGGER on_auth_user_created
              AFTER INSERT ON auth.users
              FOR EACH ROW
              EXECUTE FUNCTION public.handle_new_user();
          "

      - name: Verify Mumbai buckets, policies, realtime & auth trigger
        env:
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          set -e
          echo "=== MUMBAI STORAGE BUCKETS ==="
          psql "$NEW_DB_URL" -c "SELECT id, public, file_size_limit FROM storage.buckets ORDER BY id;"

          echo "=== MUMBAI STORAGE POLICIES COUNT ==="
          psql "$NEW_DB_URL" -c "SELECT count(*) AS storage_object_policies FROM pg_policies WHERE schemaname = 'storage' AND tablename = 'objects';"

          echo "=== MUMBAI REALTIME TABLES ==="
          psql "$NEW_DB_URL" -c "SELECT tablename FROM pg_publication_tables WHERE pubname = 'supabase_realtime' AND schemaname = 'public' ORDER BY tablename;"

          echo "=== MUMBAI AUTH TRIGGER ==="
          psql "$NEW_DB_URL" -c "SELECT tgname, tgenabled FROM pg_trigger WHERE tgrelid = 'auth.users'::regclass AND tgname = 'on_auth_user_created';"